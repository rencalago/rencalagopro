<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="chart-title chart-desc" font-family="Poppins, system-ui, sans-serif">
  <title id="chart-title">Sales and revenue growth chart</title>
  <desc id="chart-desc">Bars and a rising line showing sales and revenue increasing month over month.</desc>
  <rect width="600" height="600" fill="#ffffff"/>
  <circle cx="300" cy="300" r="296" fill="#fbfbf3"/>
  <!-- Grid -->
  <g stroke="#e6e6e6" stroke-width="2">
    <line x1="110" y1="180" x2="490" y2="180"/>
    <line x1="110" y1="250" x2="490" y2="250"/>
    <line x1="110" y1="320" x2="490" y2="320"/>
    <line x1="110" y1="390" x2="490" y2="390"/>
  </g>
  <line x1="110" y1="460" x2="490" y2="460" stroke="#222222" stroke-width="3"/>
  <!-- Bars (rising) -->
  <g fill="#d0ce76">
    <rect x="135" y="370" width="48" height="90" rx="6"/>
    <rect x="205" y="335" width="48" height="125" rx="6"/>
    <rect x="275" y="300" width="48" height="160" rx="6"/>
    <rect x="345" y="265" width="48" height="195" rx="6"/>
    <rect x="415" y="225" width="48" height="235" rx="6" fill="#a9a64f"/>
  </g>
  <!-- Revenue line -->
  <polyline points="159,350 229,305 299,270 369,225 439,190" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#222222" stroke-width="4">
    <circle cx="159" cy="350" r="8"/>
    <circle cx="229" cy="305" r="8"/>
    <circle cx="299" cy="270" r="8"/>
    <circle cx="369" cy="225" r="8"/>
    <circle cx="439" cy="190" r="8"/>
  </g>
  <!-- Trend arrow -->
  <path d="M130 300 L250 230 L300 200" fill="none" stroke="#a9a64f" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M470 150 L490 160 L480 180" fill="none" stroke="#a9a64f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Labels -->
  <text x="300" y="515" text-anchor="middle" font-size="30" font-weight="600" fill="#222222">Sales &amp; revenue, growing</text>
  <g font-size="20" fill="#5f5f5f" text-anchor="middle">
    <text x="159" y="492">Jan</text>
    <text x="229" y="492">Feb</text>
    <text x="299" y="492">Mar</text>
    <text x="369" y="492">Apr</text>
    <text x="439" y="492">May</text>
  </g>
</svg>
