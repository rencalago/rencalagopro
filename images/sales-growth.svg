<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Revenue growth chart</title>
  <desc id="d">Illustrative dashboard showing monthly revenue rising steadily compared with the previous year.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e2c"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0ce76" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#d0ce76" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d0ce76" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9a64f"/>
      <stop offset="1" stop-color="#ece9a0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ece9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ece9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0ce76" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="clip"><rect width="640" height="436" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="640" height="436" fill="url(#card)"/>
    <rect width="640" height="436" fill="url(#sheen)"/>

    <!-- Header -->
    <text x="56" y="64" font-size="13" font-weight="600" letter-spacing="2.4" fill="#8a8a8a">MONTHLY REVENUE</text>
    <text x="56" y="102" font-size="30" font-weight="600" fill="#ffffff">Steady growth</text>
    <g transform="translate(470,48)">
      <rect width="114" height="34" rx="17" fill="#d0ce76" fill-opacity="0.14" stroke="#d0ce76" stroke-opacity="0.45"/>
      <path d="M18 22 L26 13 L34 22" fill="none" stroke="#e4e19a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="22.5" font-size="13.5" font-weight="600" fill="#e4e19a">Trending</text>
    </g>

    <!-- Legend -->
    <g font-size="12.5" fill="#9a9a9a">
      <rect x="56" y="124" width="18" height="3" rx="1.5" fill="#d0ce76"/>
      <text x="82" y="130">This year</text>
      <line x1="168" y1="125.5" x2="186" y2="125.5" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="194" y="130">Last year</text>
    </g>

    <!-- Grid -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
      <line x1="56" y1="170" x2="584" y2="170"/>
      <line x1="56" y1="237" x2="584" y2="237"/>
      <line x1="56" y1="304" x2="584" y2="304"/>
    </g>
    <line x1="56" y1="372" x2="584" y2="372" stroke="#ffffff" stroke-opacity="0.14"/>

    <!-- Volume bars -->
    <g fill="#d0ce76" fill-opacity="0.10">
      <rect x="47.0" y="346" width="18" height="26" rx="4"/>
      <rect x="122.4" y="342" width="18" height="30" rx="4"/>
      <rect x="197.9" y="344" width="18" height="28" rx="4"/>
      <rect x="273.3" y="334" width="18" height="38" rx="4"/>
      <rect x="348.7" y="328" width="18" height="44" rx="4"/>
      <rect x="424.1" y="320" width="18" height="52" rx="4"/>
      <rect x="499.6" y="314" width="18" height="58" rx="4"/>
      <rect x="575.0" y="304" width="18" height="68" rx="4"/>
    </g>

    <!-- Area + lines -->
    <path d="M56.0,330.0 C68.6,327.7 106.3,317.3 131.4,316.0 C156.6,314.7 181.7,327.3 206.9,322.0 C232.0,316.7 257.1,294.0 282.3,284.0 C307.4,274.0 332.6,272.3 357.7,262.0 C382.9,251.7 408.0,233.0 433.1,222.0 C458.3,211.0 483.4,208.0 508.6,196.0 C533.7,184.0 571.4,157.7 584.0,150.0 L584,372 L56,372 Z" fill="url(#area)"/>
    <path d="M56.0,348.0 C68.6,347.0 106.3,342.3 131.4,342.0 C156.6,341.7 181.7,347.0 206.9,346.0 C232.0,345.0 257.1,338.7 282.3,336.0 C307.4,333.3 332.6,332.3 357.7,330.0 C382.9,327.7 408.0,324.0 433.1,322.0 C458.3,320.0 483.4,320.7 508.6,318.0 C533.7,315.3 571.4,308.0 584.0,306.0" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
    <path d="M56.0,330.0 C68.6,327.7 106.3,317.3 131.4,316.0 C156.6,314.7 181.7,327.3 206.9,322.0 C232.0,316.7 257.1,294.0 282.3,284.0 C307.4,274.0 332.6,272.3 357.7,262.0 C382.9,251.7 408.0,233.0 433.1,222.0 C458.3,211.0 483.4,208.0 508.6,196.0 C533.7,184.0 571.4,157.7 584.0,150.0" fill="none" stroke="url(#stroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Highlight point -->
    <line x1="584" y1="150" x2="584" y2="372" stroke="#ece9a0" stroke-opacity="0.35" stroke-dasharray="3 5"/>
    <circle cx="584" cy="150" r="26" fill="url(#glow)"/>
    <circle cx="584" cy="150" r="7.5" fill="#151515" stroke="#ece9a0" stroke-width="3.5"/>

    <!-- Month labels -->
    <g font-size="12.5" fill="#7a7a7a" text-anchor="middle">
      <text x="56.0" y="402">Jan</text>
      <text x="131.4" y="402">Feb</text>
      <text x="206.9" y="402">Mar</text>
      <text x="282.3" y="402">Apr</text>
      <text x="357.7" y="402">May</text>
      <text x="433.1" y="402">Jun</text>
      <text x="508.6" y="402">Jul</text>
      <text x="584.0" y="402">Aug</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="639" height="435" rx="27.5" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
</svg>
